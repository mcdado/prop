[package]
name = "prop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
dirs = "6.0"
futures = "0.3"
hickory-client = "0.24"
hickory-proto = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "net", "rt-multi-thread", "time"] }
toml = "0.8"

[dev-dependencies]
tokio = { version = "1.43", features = ["io-util"] }
