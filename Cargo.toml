[package]
name = "prop"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "Fast DNS propagation checks and parent-zone delegation tracing"
repository = "https://github.com/mcdado/prop"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6.11"
comfy-table = "7.1"
dirs = "6.0"
futures = "0.3"
hickory-net = "0.26.3"
hickory-proto = "0.26.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "net", "rt-multi-thread", "time"] }
toml = "0.8"

[dev-dependencies]
tokio = { version = "1.43", features = ["io-util"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
